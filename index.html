    <style>
        /* Modern Glassmorphism & Custom Aerospace Aesthetics */
        body {
            background-color: #0b132b;
            color: #e0e1dd;
            font-family: 'Inter', sans-serif;
        }

        .glass-card {
            background: rgba(28, 37, 65, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card-hover:hover {
            background: rgba(42, 59, 99, 0.85);
            border-color: rgba(72, 202, 228, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 16px 32px -10px rgba(72, 202, 228, 0.2);
        }

        .glass-nav {
            background: rgba(11, 19, 43, 0.90);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .text-gradient-cyan {
            background: linear-gradient(135deg, #72efdd 0%, #48cae4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .text-gradient-gold {
            background: linear-gradient(135deg, #ffc300 0%, #f77f00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #48cae4 0%, #00b4d8 100%);
            color: #0b132b;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .btn-gradient:hover {
            box-shadow: 0 0 20px rgba(72, 202, 228, 0.5);
            transform: translateY(-2px);
        }

        /* Radar Scanner Animation Effect */
        .radar-sweep {
            position: absolute;
            width: 100%;
            height: 100%;
            background: conic-gradient(from 0deg, rgba(72, 202, 228, 0.15), transparent 60deg);
            border-radius: 50%;
            animation: rotateRadar 8s linear infinite;
        }

        @keyframes rotateRadar {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0b132b;
        }
        ::-webkit-scrollbar-thumb {
            background: #1c2541;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #48cae4;
        }
    </style>
